name: Reproducibility smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Authenticate release manifests and frozen sources
        run: python -B -X utf8 scripts/verify_release.py

      - name: Compile public Python sources
        run: python -m compileall -q src scripts

      - name: Import reporting package
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          import enhancer_benchmark_audit
          print('enhancer_benchmark_audit import: OK')
          PY
